<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rollodex • Hoofdmenu</title>
    <style>
        :root {
            --win-blue: #0078d4;
            --win-header-bg: #202020;
            --win-bg: linear-gradient(135deg, #005a9e 0%, #0078d4 100%);
            --card-bg: #ffffff;
            --text-main: #1b1b1b;
            --font-ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --dialysis-yellow: #f8e71c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-ui); }
        body, html { width: 100%; height: 100%; background: #005a9e; color: var(--text-main); display: flex; flex-direction: column; overflow: hidden; }

        /* WINDOWS TITLEBAR */
        .win-titlebar {
            background: var(--win-header-bg);
            color: #ffffff;
            height: 42px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .win-title-left { display: flex; align-items: center; gap: 8px; }
        .win-title-right { display: flex; align-items: center; gap: 10px; }

        .win-clock {
            font-size: 11px;
            opacity: 0.9;
            background: rgba(255,255,255,0.08);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .win-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .win-btn:hover { background: rgba(255,255,255,0.25); }

        /* WORKSPACE GRID */
        .workspace {
            flex: 1;
            padding: 20px;
            background: var(--win-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .menu-container {
            width: 100%;
            max-width: 820px;
        }

        .welcome-header {
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .welcome-header h1 { font-size: 22px; font-weight: 800; }
        .welcome-header p { font-size: 13px; opacity: 0.9; }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .rollodex-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 20px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .rollodex-card:hover {
            transform: translateY(-4px);
            background: #ffffff;
            box-shadow: 0 12px 26px rgba(0,0,0,0.3);
            border-color: var(--win-blue);
        }

        .card-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--win-blue);
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 11px;
            color: #666;
            font-weight: 600;
        }

        /* GEBRUIKER SELECTOR CARD */
        .user-select-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-select-card select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- WINDOWS TITLEBAR -->
    <div class="win-titlebar">
        <div class="win-title-left">
            <span>📇 Rollodex • Hoofdmenu</span>
            <span id="gebruikerTitleBadge" style="font-size: 11px; background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 12px; font-weight: bold; color: var(--dialysis-yellow);">Patiënt: ...</span>
        </div>
        <div class="win-title-right">
            <div id="liveClock" class="win-clock">Laden...</div>
            <button type="button" class="win-btn" onclick="toggleFullscreen()" title="Volledig Scherm">⛶ Scherm</button>
        </div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace">
        <div class="menu-container">
            
            <div class="welcome-header">
                <h1>Welkom bij Rollodex</h1>
                <p>Kies een module om te starten</p>
            </div>

            <!-- PATIËNT / GEBRUIKER SELECTIE -->
            <div class="user-select-card">
                <span>👤 Actieve Patiënt / Gebruiker:</span>
                <select id="selectGebruiker" onchange="wisselGebruiker(this.value)">
                    <option value="Gast">Gast</option>
                </select>
            </div>

            <!-- GRID MET ROLLODEX APPS -->
            <div class="grid-menu">
                
                <!-- 1. DIALYSE MONITOR -->
                <a href="dialyse.html" class="rollodex-card">
                    <div class="card-icon">🩺</div>
                    <div class="card-title">Dialyse Monitor</div>
                    <div class="card-desc">UF berekeningen, timer, gewichten & bloeddrukmetingen</div>
                </a>

                <!-- 2. CONSUMPTIE MONITOR (NIEUW) -->
                <a href="consumptie.html" class="rollodex-card">
                    <div class="card-icon">🍵</div>
                    <div class="card-title">Consumptie Monitor</div>
                    <div class="card-desc">Vochtinname bijhouden, daglimiet & voeding overzicht</div>
                </a>

            </div>

        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let actieveGebruiker = localStorage.getItem('actieve_gebruiker') || 'Gast';
            document.getElementById('gebruikerTitleBadge').innerText = `Patiënt: ${actieveGebruiker.charAt(0).toUpperCase() + actieveGebruiker.slice(1)}`;
            
            vulGebruikersDropdown(actieveGebruiker);
            startKlok();
        });

        function startKlok() {
            setInterval(() => {
                let nu = new Date();
                document.getElementById('liveClock').innerText = nu.toLocaleString('nl-NL');
            }, 1000);
        }

        function vulGebruikersDropdown(actieve) {
            let select = document.getElementById('selectGebruiker');
            let gebruikers = ['Gast', 'Patiënt 1']; // Uitbreidbaar
            select.innerHTML = '';
            gebruikers.forEach(g => {
                let opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                if (g.toLowerCase() === actieve.toLowerCase()) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function wisselGebruiker(naam) {
            localStorage.setItem('actieve_gebruiker', naam);
            document.getElementById('gebruikerTitleBadge').innerText = `Patiënt: ${naam.charAt(0).toUpperCase() + naam.slice(1)}`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
